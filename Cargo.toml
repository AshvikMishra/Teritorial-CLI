[workspace]
resolver = "2"
members = ["core", "render", "ui", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
authors = ["Ashvik Mishra"]

[workspace.dependencies]
territorial-core = { path = "core" }
territorial-render = { path = "render" }
territorial-ui = { path = "ui" }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
